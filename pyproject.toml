[project]
name = "ghas-reporting-engine"
version = "0.1.0"
description = "A CLI tool to generate reports from GitHub Advanced Security findings mapped to compliance frameworks."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "WritingPanda", email = "writingpanda@example.com" }]
keywords = [
  "github",
  "security",
  "ghas",
  "compliance",
  "owasp",
  "sans",
  "mitre",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "click>=8.1.0",
  "requests>=2.31.0",
  "pydantic>=2.5.0",
  "jinja2>=3.1.0",
  "python-dateutil>=2.8.0",
  "rich>=13.0.0",
  "pygithub>=2.1.1",
]

[project.optional-dependencies]
pdf = ["weasyprint>=60.0"]
dev = [
  "pytest>=7.4.0",
  "pytest-cov>=4.1.0",
  "pytest-mock>=3.11.0",
  "black>=23.0.0",
  "ruff>=0.1.0",
  "mypy>=1.7.0",
  "types-requests>=2.31.0",
  "types-python-dateutil>=2.8.0",
]
build = ["pyinstaller>=6.0.0", "build>=1.0.0"]

[project.scripts]
ghas-report = "ghas_reporting_engine.cli:main"

[project.urls]
Homepage = "https://github.com/WritingPanda/ghas-reporting-engine-action"
Repository = "https://github.com/WritingPanda/ghas-reporting-engine-action"
Issues = "https://github.com/WritingPanda/ghas-reporting-engine-action/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "pytest>=7.4.0",
  "pytest-cov>=4.1.0",
  "pytest-mock>=3.11.0",
  "black>=23.0.0",
  "ruff>=0.1.0",
  "mypy>=1.7.0",
  "types-requests>=2.31.0",
  "types-python-dateutil>=2.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ghas_reporting_engine"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "W",
  "I",
  "N",
  "UP",
  "S",
  "B",
  "A",
  "C4",
  "T10",
  "EM",
  "G",
  "PIE",
  "PT",
  "Q",
  "RET",
  "SIM",
  "ARG",
  "PTH",
  "ERA",
  "PL",
  "TRY",
  "RUF",
]
ignore = ["S101", "PLR0913", "PLR0912", "PLR0915"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--strict-markers --strict-config --cov=src/ghas_reporting_engine --cov-report=term-missing --cov-report=html"
