name: "GHAS Reporting Engine"
description: "Generate compliance reports from GitHub Advanced Security CodeQL alerts aligned with OWASP Top 10, SANS Top 25, and MITRE KEV frameworks"
branding:
  icon: "shield"
  color: "blue"

inputs:
  token:
    description: "GitHub token with security_events:read and repo:read permissions"
    required: true
    default: ${{ github.token }}

  organization:
    description: "GitHub organization to scan"
    default: ${{ github.repository_owner }}
    required: false

  frameworks:
    description: "Comma-separated list of frameworks to analyze (owasp, sans, kev)"
    required: true
    default: "owasp,sans,kev"

  output_format:
    description: "Output format for reports (markdown, json)"
    required: false
    default: "markdown"

  include_empty:
    description: "Include categories with zero alerts in reports"
    required: false
    default: "false"

  since_date:
    description: "Only include alerts created after this date (ISO 8601 format: YYYY-MM-DD)"
    required: false

  until_date:
    description: "Only include alerts created before this date (ISO 8601 format: YYYY-MM-DD)"
    required: false

  repositories:
    description: "Comma-separated list of specific repositories to scan (optional filter)"
    required: false

outputs:
  reports_generated:
    description: "Number of reports generated"

  report_summary:
    description: "Summary of the generated reports"

runs:
  using: "node20"
  main: "dist/index.js"
