name: Test GHAS Reporting Engine
on:
  # push:
  #   branches:
  #     - main
  # pull_request:
  #   branches:
  #     - main
  workflow_dispatch:
    inputs:
      organization:
        description: 'Organization to scan'
        required: false
        default: 'Pandante-Central'
      frameworks:
        description: 'Frameworks to test'
        required: false
        default: 'owasp,sans,kev'
permissions:
  contents: read
  security-events: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      security-events: read
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build action
        run: |
          npm run build
          npm run bundle
      
      - name: Test with sample organization
        uses: ./
        with:
          organization: ${{ github.event.inputs.organization }}
          frameworks: ${{ github.event.inputs.frameworks || 'owasp,sans,kev' }}
          output_format: 'markdown'
          include_empty: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ghas-reports-${{ github.run_number }}
          path: reports/
          retention-days: 30
