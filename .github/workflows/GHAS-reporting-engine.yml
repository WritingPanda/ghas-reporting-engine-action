name: GHAS Reporting Engine
on:
  workflow_dispatch:
    inputs:
      organization:
        description: 'Organization or Enterprise to scan'
      frameworks:
        description: 'Frameworks to test'
        default: 'owasp,sans,kev'

jobs:
  generate_reports:
    runs-on: ubuntu-latest
    permissions:
      security-events: read
      contents: read
      actions: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build action
        run: |
          npm run build
          npm run bundle

      - name: Generate ${{ github.event.inputs.frameworks }} Report(s) for ${{ github.event.inputs.organization }}
        id: generate-reports
        uses: ./
        with:
          organization: ${{ github.event.inputs.organization }}
          frameworks: ${{ github.event.inputs.frameworks || 'owasp,sans,kev' }}
          output_format: 'markdown'
          include_empty: true
        env:        
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: steps.generate-reports.conclusion == 'success'
        with:
          name: ghas-reports-${{ github.run_number }}
          path: reports/
          retention-days: 30
