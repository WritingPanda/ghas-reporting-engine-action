name: GHAS Reporting Engine
on:
  push:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      organization:
        description: 'Organization to generate report'
      frameworks:
        description: 'Frameworks to use for report'
        default: 'owasp,sans,kev'

jobs:
  generate_reports:
    runs-on: ubuntu-latest
    permissions:
      security-events: read
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build action
        run: |
          npm run build
          npm run bundle

      - name: Generate Report
        id: generate-reports
        uses: ./
        with:
          organization: ${{ github.event.inputs.organization }}
          frameworks: ${{ github.event.inputs.frameworks || 'owasp,sans,kev' }}
          output_format: 'markdown'
          include_empty: true
        env:        
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: ghas-reports-${{ github.run_number }}
          path: reports/
          retention-days: 1
          
      - name: Download reports
        uses: actions/download-artifact@v4
        with:
          name: ghas-reports-${{ github.run_number }}
          path: reports/
