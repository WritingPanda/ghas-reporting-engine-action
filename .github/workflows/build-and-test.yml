name: Build and Test

on:
  push:
    branches: [main, go-rewrite]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Download modules
        run: go mod download
      - name: Run tests
        run: go test -v ./...
