name: Build and Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check src/ tests/

      - name: Format check with black
        run: |
          black --check src/ tests/

      - name: Type check with mypy
        run: |
          mypy src/ghas_reporting_engine/

      - name: Test with pytest
        run: |
          pytest tests/ -v --cov=src/ghas_reporting_engine --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

  integration-test:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Test CLI help
        run: |
          ghas-report --help

      - name: Test GitHub Action (dry run)
        uses: ./.github/actions/ghas-reporting
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          organization: "microsoft" # Use a known public org for testing
          report-types: "owasp"
          report-formats: "json"
          days-back: "7"
        continue-on-error: true # Allow failure for demo purposes
