name: "GHAS Reporting Engine"
description: "Generate compliance reports from GitHub Advanced Security findings"
author: "WritingPanda"

branding:
  icon: "shield"
  color: "blue"

inputs:
  github-token:
    description: "GitHub token for API access"
    required: true
  organization:
    description: "GitHub organization name (mutually exclusive with enterprise)"
    required: false
  enterprise:
    description: "GitHub enterprise name (mutually exclusive with organization)"
    required: false
  report-types:
    description: "Comma-separated list of report types (owasp,sans,mitre)"
    required: false
    default: "owasp,sans,mitre"
  report-formats:
    description: "Comma-separated list of report formats (json,csv,html,pdf)"
    required: false
    default: "json,html,pdf"
  days-back:
    description: "Number of days to look back for alerts"
    required: false
    default: "30"
  output-path:
    description: "Path for report output"
    required: false
    default: "./reports"
  include-dismissed:
    description: "Include dismissed alerts in the report"
    required: false
    default: "false"
  severity-filter:
    description: "Filter alerts by severity (critical,high,medium,low)"
    required: false
  upload-pdf:
    description: "Upload PDF to Code Scanning"
    required: false
    default: "true"

outputs:
  reports-path:
    description: "Path to generated reports"
    value: ${{ steps.ghas-report.outputs.reports-path }}
  summary:
    description: "Brief summary of the analysis"
    value: ${{ steps.ghas-report.outputs.summary }}
  total-alerts:
    description: "Total number of alerts analyzed"
    value: ${{ steps.ghas-report.outputs.total-alerts }}
  mapped-alerts:
    description: "Number of alerts mapped to compliance frameworks"
    value: ${{ steps.ghas-report.outputs.mapped-alerts }}
  pdf-path:
    description: "Path to generated PDF report"
    value: ${{ steps.ghas-report.outputs.pdf-path }}

runs:
  using: "composite"
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v2
      with:
        enable-cache: true

    - name: Set up Python
      shell: bash
      run: uv python install 3.11

    - name: Install GHAS Reporting Engine
      shell: bash
      run: |
        cd ${{ github.action_path }}/../../
        uv sync

    - name: Run GHAS Reporting Engine
      shell: bash
      id: ghas-report
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        # Build command arguments
        args="--log-level INFO"

        if [ -n "${{ inputs.organization }}" ]; then
          args="$args --organization '${{ inputs.organization }}'"
        fi

        if [ -n "${{ inputs.enterprise }}" ]; then
          args="$args --enterprise '${{ inputs.enterprise }}'"
        fi

        if [ -n "${{ inputs.report-types }}" ]; then
          args="$args --report-types '${{ inputs.report-types }}'"
        fi

        if [ -n "${{ inputs.report-formats }}" ]; then
          args="$args --report-formats '${{ inputs.report-formats }}'"
        fi

        if [ -n "${{ inputs.days-back }}" ]; then
          args="$args --days-back ${{ inputs.days-back }}"
        fi

        if [ -n "${{ inputs.output-path }}" ]; then
          args="$args --output-dir '${{ inputs.output-path }}'"
        fi

        if [ "${{ inputs.include-dismissed }}" = "true" ]; then
          args="$args --include-dismissed"
        fi

        if [ -n "${{ inputs.severity-filter }}" ]; then
          args="$args --severity-filter '${{ inputs.severity-filter }}'"
        fi

        # Run the CLI
        echo "Running: ghas-report $args"
        cd ${{ github.action_path }}/../../
        eval "uv run ghas-report $args" | tee ghas_output.log

        # Extract summary information
        if [ -d "${{ inputs.output-path || './reports' }}" ]; then
          reports_count=$(find "${{ inputs.output-path || './reports' }}" -name "*.json" -o -name "*.csv" -o -name "*.html" | wc -l)
          echo "reports-path=${{ inputs.output-path || './reports' }}" >> $GITHUB_OUTPUT
          echo "Reports generated: $reports_count" >> $GITHUB_STEP_SUMMARY
          
          # Try to extract summary from the first JSON report
          json_report=$(find "${{ inputs.output-path || './reports' }}" -name "*.json" | head -1)
          if [ -f "$json_report" ]; then
            total_alerts=$(jq -r '.summary.total_alerts // 0' "$json_report")
            open_alerts=$(jq -r '.summary.open_alerts // 0' "$json_report")
            target_name=$(jq -r '.target_name // "unknown"' "$json_report")
            
            echo "total-alerts=$total_alerts" >> $GITHUB_OUTPUT
            
            # Create summary
            echo "## GHAS Security Report Summary" >> $GITHUB_STEP_SUMMARY
            echo "- **Target:** $target_name" >> $GITHUB_STEP_SUMMARY
            echo "- **Total Alerts:** $total_alerts" >> $GITHUB_STEP_SUMMARY
            echo "- **Open Alerts:** $open_alerts" >> $GITHUB_STEP_SUMMARY
            echo "- **Reports Generated:** $reports_count" >> $GITHUB_STEP_SUMMARY
            echo "- **Report Period:** ${{ inputs.days-back || '30' }} days" >> $GITHUB_STEP_SUMMARY
            
            echo "summary=Target: $target_name, Alerts: $total_alerts, Open: $open_alerts" >> $GITHUB_OUTPUT
          fi
        fi

        # Find PDF report for upload
        pdf_report=$(find "${{ inputs.output-path || './reports' }}" -name "*.pdf" | head -1)
        if [ -f "$pdf_report" ]; then
          echo "pdf-path=$pdf_report" >> $GITHUB_OUTPUT
        fi

    - name: Upload PDF to Code Scanning
      shell: bash
      if: inputs.upload-pdf == 'true' && steps.ghas-report.outputs.pdf-path != ''
      run: |
        pdf_path="${{ steps.ghas-report.outputs.pdf-path }}"

        if [ -f "$pdf_path" ]; then
          echo "Uploading PDF report to Code Scanning..."
          
          # Create a Code Scanning attachment
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${{ github.repository }}/code-scanning/analyses" \
            -f "commit_sha=${{ github.sha }}" \
            -f "ref=${{ github.ref }}" \
            -f "tool_name=GHAS Reporting Engine" \
            -f "category=security-report" \
            -F "sarif=@$pdf_path" || echo "Warning: Failed to upload PDF to Code Scanning"
          
          echo "✅ PDF report available in Code Scanning" >> $GITHUB_STEP_SUMMARY
        fi
      env:
        GH_TOKEN: ${{ inputs.github-token }}

    - name: Upload Reports as Artifacts
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: ghas-security-reports
        path: ${{ inputs.output-path || './reports' }}
        retention-days: 7

    - name: Add Report Links to Summary
      shell: bash
      if: always()
      run: |
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📄 Generated Reports" >> $GITHUB_STEP_SUMMARY

        if [ -d "${{ inputs.output-path || './reports' }}" ]; then
          for report in $(find "${{ inputs.output-path || './reports' }}" -name "*.html" -o -name "*.json" -o -name "*.csv"); do
            filename=$(basename "$report")
            echo "- [$filename](./reports/$filename)" >> $GITHUB_STEP_SUMMARY
          done
        fi

        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Reports are available as artifacts for 7 days." >> $GITHUB_STEP_SUMMARY
